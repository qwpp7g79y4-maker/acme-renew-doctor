name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # The release workflow runs these same checks on the tagged commit first.
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, stable)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon; macos-15-intel is x86_64.
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
      # The JSON tests check the output with Python's json module.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # Overflow checks differ between debug and release builds.
      - run: cargo test --locked --no-fail-fast --release

  glibc:
    name: glibc baseline (ubuntu-22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: bash scripts/check-glibc.sh target/release/acme-renew-doctor 2.34

  msrv:
    name: Test (ubuntu-latest, Rust 1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.85
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked --no-fail-fast
      # Overflow checks differ between debug and release builds.
      - run: cargo test --locked --no-fail-fast --release

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check licenses

  fuzz-build:
    name: Fuzz targets build (ubuntu-latest, nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: fuzz
      # Build only: this checks the fuzz targets still compile against the
      # library, not run them. Long fuzzing runs are done separately.
      - run: cargo fuzz build --target x86_64-unknown-linux-gnu
